name: Application quality

on:
  push:
    branches: [main, 'feat/biblioteca-textual']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture_not_a_real_key
      PRIVATE_LIBRARY_ENABLED: 'false'
      PRIVATE_FILES_ENABLED: 'false'
      SELF_SIGNUP_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Record bundled Next.js guidance availability
        run: |
          if [ -d node_modules/next/dist/docs ]; then
            find node_modules/next/dist/docs -type f > /tmp/next-guidance-files.txt
            head -n 20 /tmp/next-guidance-files.txt
          fi
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Test guest access and private routes against the build
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 > /tmp/memoria-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/memoria-next.log; exit 1; fi
          node tests/smoke/anonymous.mjs
          node tests/smoke/signup.mjs
          node tests/smoke/import.mjs
          node tests/smoke/files.mjs
